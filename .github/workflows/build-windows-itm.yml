name: Build and verify Windows NTIA ITM DLL
on:
  workflow_dispatch:
  push:
    paths:
      - 'native_itm/**'
      - 'itm_bridge.h'
      - 'radioplanner/itm_native.py'
      - 'verify_itm_engine.py'
jobs:
  windows-itm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native DLL (MSVC x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd native_itm
          cl /nologo /std:c++17 /EHsc /O2 /LD /I ntia_src\include itm_bridge.cpp ntia_src\src\*.cpp /link /OUT:rp_itm.dll
      - name: Verify real NTIA ITM calls
        shell: pwsh
        run: python verify_itm_engine.py native_itm/rp_itm.dll
      - name: Run interface tests
        shell: pwsh
        run: python -m unittest test_itm_native_417.py
      - name: Publish verified DLL
        uses: actions/upload-artifact@v4
        with:
          name: RadioPlanner-ITM-Windows-x64
          path: native_itm/rp_itm.dll
          if-no-files-found: error
